<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agente Triad</title>
<style>
:root{--bg:#04060d;--glass:rgba(16,22,40,.55);--line:rgba(120,160,255,.16);--txt:#e6edff;--mut:#7f8bab;--c1:#00e5ff;--c2:#8a5cff;--c3:#ff3df2;--ok:#27f5a0;--warn:#ffc233;--bad:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);font:15px/1.55 "SF Pro Text",-apple-system,Inter,sans-serif;height:100vh;display:flex;flex-direction:column;background:
 radial-gradient(900px 500px at 15% -10%,rgba(138,92,255,.28),transparent 60%),
 radial-gradient(800px 500px at 100% 10%,rgba(0,229,255,.18),transparent 60%),
 radial-gradient(700px 500px at 50% 120%,rgba(255,61,242,.14),transparent 60%),var(--bg);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;mask-image:radial-gradient(ellipse at 50% 30%,#000 0,transparent 75%)}
header{position:relative;display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);background:rgba(4,6,13,.55)}
.orb{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c3),var(--c1));filter:drop-shadow(0 0 10px var(--c2));animation:spin 6s linear infinite;position:relative}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
body.busy .orb{animation-duration:1.1s;filter:drop-shadow(0 0 18px var(--c1))}
@keyframes spin{to{transform:rotate(360deg)}}
header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.22em;text-transform:uppercase;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
header span{color:var(--mut);font:11px ui-monospace,Menlo,monospace;letter-spacing:.08em}
.sp{flex:1}
.ghost{background:var(--glass);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:7px 12px;cursor:pointer;font:12px ui-monospace,Menlo,monospace;transition:.2s}
.ghost:hover,.ghost.on{color:var(--c1);border-color:var(--c1);box-shadow:0 0 14px rgba(0,229,255,.25)}
main{position:relative;flex:1;overflow-y:auto;padding:28px 0}
.wrap{max-width:800px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:16px}
.msg{padding:13px 18px;border-radius:16px;max-width:86%;white-space:pre-wrap;word-wrap:break-word;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--c2),#5b3dff);color:#fff;border-bottom-right-radius:4px;box-shadow:0 6px 30px rgba(138,92,255,.4)}
.ag{align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:4px;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tool{align-self:flex-start;color:var(--c1);font:11px ui-monospace,Menlo,monospace;padding-left:8px;letter-spacing:.06em;opacity:.8}
.tool::before{content:"▸ "}
.card{align-self:flex-start;width:100%;background:var(--glass);border:1px solid rgba(255,194,51,.5);border-radius:16px;padding:16px 18px;backdrop-filter:blur(14px);box-shadow:0 0 28px rgba(255,194,51,.12);animation:in .3s ease}
.card.danger{border-color:rgba(255,77,109,.7);box-shadow:0 0 34px rgba(255,77,109,.22)}
.card h3{margin:0 0 8px;font:11px ui-monospace,Menlo,monospace;color:var(--warn);text-transform:uppercase;letter-spacing:.14em}
.card.danger h3{color:var(--bad)}
.card pre{margin:0 0 14px;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--mut);white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto}
.btns{display:flex;gap:10px}
.btn{border:0;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer;transition:.2s}
.go{background:linear-gradient(135deg,var(--ok),var(--c1));color:#02130d;box-shadow:0 0 20px rgba(39,245,160,.35)}
.card.danger .go{background:linear-gradient(135deg,var(--c3),var(--bad));color:#fff;box-shadow:0 0 22px rgba(255,77,109,.45)}
.go:hover{transform:translateY(-1px)}
.no{background:rgba(255,255,255,.07);color:var(--txt)}.card.done{opacity:.5}
.err{color:var(--bad)}.typing{color:var(--c1);font:12px ui-monospace,Menlo,monospace;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
footer{position:relative;padding:14px 24px 20px;backdrop-filter:blur(14px);background:rgba(4,6,13,.5);border-top:1px solid var(--line)}
.drop{max-width:800px;margin:0 auto 12px;border:1px dashed rgba(0,229,255,.3);border-radius:14px;padding:10px;text-align:center;color:var(--mut);font:12px ui-monospace,Menlo,monospace;letter-spacing:.04em;transition:.2s}
.drop.over{border-color:var(--c1);color:var(--c1);background:rgba(0,229,255,.08);box-shadow:0 0 26px rgba(0,229,255,.25)}
.bar{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;padding:8px;border-radius:18px;background:var(--glass);border:1px solid var(--line);transition:.2s}
.bar:focus-within{border-color:var(--c2);box-shadow:0 0 30px rgba(138,92,255,.3)}
textarea{flex:1;background:transparent;border:0;color:var(--txt);padding:11px 8px;font:inherit;resize:none;max-height:140px;outline:none}
.ic{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-size:18px;cursor:pointer;transition:.2s}
.ic:hover{border-color:var(--c1);box-shadow:0 0 16px rgba(0,229,255,.3)}
.ic.rec{background:var(--bad);border-color:var(--bad);animation:p 1s infinite;box-shadow:0 0 26px var(--bad)}
.send{background:linear-gradient(135deg,var(--c1),var(--c2));border:0;color:#041018}
@keyframes p{50%{opacity:.6}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style></head><body>
<header><div class="orb"></div><h1>Triad · Agente</h1><span>META ADS // LOCALHOST</span><div class="sp"></div>
<button class="ghost on" id="spk" title="Ler respostas em voz alta">🔊 VOZ</button><button class="ghost" id="new">＋ NOVA</button></header>
<main id="main"><div class="wrap" id="chat">
<div class="msg ag">Oi! Diga a conta, a cidade e o raio, o orçamento por dia e arraste o vídeo aqui embaixo. Eu monto tudo como rascunho e só ativo quando você aprovar.</div>
</div></main>
<footer><div class="drop" id="drop">📎 Arraste o vídeo ou a arte aqui</div>
<div class="bar"><button class="ic" id="mic" title="Falar">🎤</button><textarea id="in" rows="1" placeholder="Escreva ou use o microfone…"></textarea><button class="ic send" id="send">➤</button></div></footer>
<script>
const $=id=>document.getElementById(id),chat=$('chat'),main=$('main'),input=$('in');
let busy=false,speak=true,attached=[];
const scroll=()=>main.scrollTop=main.scrollHeight;
function add(cls,txt){const d=document.createElement('div');d.className=cls;d.textContent=txt;chat.appendChild(d);scroll();return d}
$('spk').onclick=e=>{speak=!speak;e.target.classList.toggle('on',speak);if(!speak)speechSynthesis.cancel()};
$('new').onclick=async()=>{await fetch('/api/reset',{method:'POST'});chat.innerHTML='';add('msg ag','Conversa nova. O que vamos subir?')};
input.oninput=()=>{input.style.height='auto';input.style.height=input.scrollHeight+'px'};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('send').onclick=send;
// voz
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('mic').onclick=()=>{if(!SR)return alert('Use o Chrome para voz.');
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='pt-BR';rec.interimResults=true;$('mic').classList.add('rec');
 rec.onresult=e=>{input.value=[...e.results].map(r=>r[0].transcript).join('')};
 rec.onend=()=>{rec=null;$('mic').classList.remove('rec');if(input.value.trim())send()};rec.start()};
function say(t){if(!speak||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F300}-\u{1FAFF}✅⚠️]/gu,''));u.lang='pt-BR';u.rate=1.25;const v=speechSynthesis.getVoices().find(x=>x.lang==='pt-BR'&&/Google|Luciana|Felipe/.test(x.name))||speechSynthesis.getVoices().find(x=>x.lang==='pt-BR');if(v)u.voice=v;speechSynthesis.speak(u)}
// upload
const drop=$('drop');
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',async e=>{for(const f of e.dataTransfer.files){drop.textContent='Enviando '+f.name+'…';
 const r=await fetch('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f});const j=await r.json();
 attached.push(j.path);drop.textContent='✅ '+f.name+' pronto (vai junto na próxima mensagem)'}});
async function send(){
 let t=input.value.trim();if(!t||busy)return;
 if(attached.length){t+='\n\nArquivo(s) enviados pelo painel: '+attached.join(', ');attached=[];drop.textContent='📎 Arraste o vídeo ou a arte aqui'}
 input.value='';input.style.height='auto';add('msg me',t.split('\n\nArquivo')[0]);busy=true;document.body.classList.add('busy');speechSynthesis.cancel();
 const wait=add('typing','pensando…');let cur=null,full='';
 const res=await fetch('/api/chat',{method:'POST',body:JSON.stringify({text:t})});
 const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
 while(true){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
  const parts=buf.split('\n\n');buf=parts.pop();
  for(const p of parts){const ev=p.match(/event: (.*)/)[1],data=JSON.parse(p.match(/data: (.*)/)[1]);wait.remove();
   if(ev==='text'){if(!cur){cur=add('msg ag','');full=''}full+=data;cur.textContent=full;scroll()}
   else if(ev==='tool'){cur=null;add('tool',data.name)}
   else if(ev==='approval'){cur=null;card(data)}
   else if(ev==='done'){if(data.error)add('msg ag err',data.error);say(full)}}}
 wait.remove();busy=false;document.body.classList.remove('busy')}
function card(a){const c=document.createElement('div');c.className='card'+(a.danger?' danger':'');
 c.innerHTML=`<h3>${a.danger?'Vai ao ar — aprovar?':'Aprovar ação?'} · ${a.tool}</h3><pre></pre><div class="btns"><button class="btn go">${a.danger?'Ativar':'Permitir'}</button><button class="btn no">Negar</button></div>`;
 c.querySelector('pre').textContent=a.detail;chat.appendChild(c);scroll();
 const fin=ok=>{fetch('/api/approve',{method:'POST',body:JSON.stringify({id:a.id,allow:ok})});c.classList.add('done');c.querySelector('.btns').innerHTML=ok?'✅ Aprovado':'⛔ Negado'};
 c.querySelector('.go').onclick=()=>fin(true);c.querySelector('.no').onclick=()=>fin(false)}
</script></body></html>
